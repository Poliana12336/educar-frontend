<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<title>Livro Digital - educAR</title>

<link rel="stylesheet" href="css/style.css">

<style>

.livro{
max-width:900px;
margin:auto;
}

.capitulo-box{
background:white;
padding:40px;
border-radius:24px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.badge{
display:inline-block;
padding:8px 14px;
background:#5B88B2;
color:white;
border-radius:999px;
margin-bottom:20px;
}

.resumo{
margin-top:20px;
line-height:1.8;
font-size:18px;
color:#333;
}

.marker{
margin-top:40px;
padding:20px;
border:3px dashed #122C4F;
border-radius:20px;
text-align:center;
}

.marker h3{
margin-bottom:15px;
}

.marker img{
width:220px;
}

button{
margin-top:30px;
width:auto;
padding:14px 24px;
}

</style>

</head>

<body>

<div class="main">

<div class="livro">

<div class="capitulo-box">

<div id="conteudo"></div>

</div>

</div>

</div>

<script src="js/api.js"></script>
<script src="js/livro.js"></script>

</body>
</html>
